<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Log in — Foundra</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="shared-auth.js"></script>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-K9SRRG5MH0"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-K9SRRG5MH0');
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0A0A0A;--paper:#FAFAF7;--line:#E6E4DC;--muted:#8A8780;--beta:#9A6B00;--beta-bg:#FEF7E6;--err:#9A2B2B;--err-bg:#FBE9E9}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input{font-family:inherit;font-size:inherit;color:inherit}

.beta-banner{background:var(--beta-bg);border-bottom:1px solid #F0DCB0;padding:9px 40px;font-size:12px;color:var(--beta);text-align:center}
.beta-banner strong{font-weight:600}

header{display:flex;align-items:center;justify-content:space-between;padding:24px 40px;border-bottom:1px solid var(--line);max-width:1280px;margin:0 auto}
.brand{font-family:'Instrument Serif',serif;font-size:24px;letter-spacing:-.6px;display:flex;align-items:center;gap:10px}
.brand-mark{width:24px;height:24px;background:var(--ink);border-radius:5px;position:relative;flex-shrink:0}
.brand-mark::before{content:'';position:absolute;left:8px;top:6px;width:2px;height:12px;background:var(--paper)}
.brand-mark::after{content:'';position:absolute;left:8px;top:6px;width:9px;height:2px;background:var(--paper);box-shadow:0 5px 0 var(--paper)}
.brand-mark .spark{position:absolute;right:5px;top:6px;width:3px;height:3px;background:var(--paper);border-radius:50%}
.beta-pill{display:inline-block;font-size:9px;font-weight:600;letter-spacing:1px;padding:2px 7px;border-radius:100px;background:var(--beta-bg);color:var(--beta);border:1px solid #F0DCB0;margin-left:6px;text-transform:uppercase}
.header-link{font-size:13px;color:var(--muted)}
.header-link strong{color:var(--ink);font-weight:500;border-bottom:1px solid var(--line);margin-left:4px;padding-bottom:1px}

.page{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 130px);padding:40px 24px}
.form-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:48px 44px;max-width:420px;width:100%}
.form-card h1{font-family:'Instrument Serif',serif;font-size:36px;letter-spacing:-1px;font-weight:400;margin-bottom:8px}
.form-card h1 em{font-style:italic;color:var(--muted)}
.form-card .sub{font-size:14px;color:var(--muted);margin-bottom:32px;line-height:1.55}

form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.field-row{display:flex;justify-content:space-between;align-items:center}
.field-row a{font-size:11px;color:var(--muted);transition:color .15s}
.field-row a:hover{color:var(--ink)}
.field input{padding:13px 16px;border:1px solid var(--line);border-radius:8px;font-size:15px;outline:none;background:var(--paper);transition:border-color .15s}
.field input:focus{border-color:var(--ink)}

.error-box{background:var(--err-bg);border:1px solid #F0CACA;border-radius:8px;padding:12px 14px;color:var(--err);font-size:13px;line-height:1.5;display:none}
.error-box.on{display:block}

.btn-submit{padding:14px;background:var(--ink);color:var(--paper);border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.btn-submit:hover{opacity:.85}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}

.alt-link{text-align:center;font-size:13px;color:var(--muted);margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}
.alt-link a{color:var(--ink);font-weight:500;border-bottom:1px solid var(--line);padding-bottom:1px}

@media(max-width:580px){
  .form-card{padding:36px 28px}
  .form-card h1{font-size:28px}
}
</style>
</head>
<body>

<div class="beta-banner"><strong>Beta</strong> · Free during this period.</div>

<header>
  <a href="index.html" class="brand"><span class="brand-mark"><span class="spark"></span></span>Foundra<span class="beta-pill">Beta</span></a>
  <span class="header-link">New here?<a href="signup.html"><strong>Sign up</strong></a></span>
</header>

<div class="page">
  <div class="form-card">
    <h1>Welcome <em>back.</em></h1>
    <p class="sub">Log in to access your checklist and dashboard.</p>
    
    <div class="error-box" id="errorBox"></div>
    
    <form id="loginForm" onsubmit="onLogin(event)">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com"/>
      </div>
      <div class="field">
        <div class="field-row">
          <label for="password">Password</label>
          <a href="#" onclick="onForgot(event)">Forgot password?</a>
        </div>
        <input type="password" id="password" name="password" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">
        Log in
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 9L9 3M9 3H4M9 3V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </form>
    
    <p class="alt-link">Don't have an account? <a href="signup.html">Create one →</a></p>
  </div>
</div>

<script>
function showError(msg) {
  const box = document.getElementById("errorBox");
  box.textContent = msg;
  box.classList.add("on");
}

function onLogin(e) {
  e.preventDefault();
  document.getElementById("errorBox").classList.remove("on");
  const btn = document.getElementById("submitBtn");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  
  btn.disabled = true;
  btn.innerHTML = "Logging in...";
  
  setTimeout(() => {
    const result = FoundraAuth.login(email, password);
    if (!result.success) {
      btn.disabled = false;
      btn.innerHTML = 'Log in <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 9L9 3M9 3H4M9 3V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
      return showError(result.error);
    }
    if (typeof gtag === 'function') gtag('event','login_success');
    
    // Redirect to where they came from, or dashboard
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get("redirect");
    if (redirect && redirect.startsWith("/")) {
      window.location.href = redirect.substring(1);
    } else {
      window.location.href = "dashboard.html";
    }
  }, 500);
}

function onForgot(e) {
  e.preventDefault();
  alert("Password reset is a prototype feature.\n\nIn the real product, you'd receive an email with a reset link.\n\nFor now: you can create a new account with a different email.");
}

if (FoundraAuth.isLoggedIn()) {
  window.location.href = "dashboard.html";
}
</script>
</body>
</html>
